<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <title>Ophicina do Sol</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="comercial.js" defer></script>
    <script type="module" src="block.js" defer></script>
</head>
<body>
    <div id="titulo-imagem">
        <img src="logo.webp" />
    </div>
    <div id="comercial1">
        <h1>Comercial</h1>
        <input type="email" id="comercial-email" placeholder="Email">
        <input type="password" id="comercial-password" placeholder="Senha">
        <button id="comercial-login">Entrar</button>
        <button id="back1">Voltar</button>
    </div>
    <div id="dashboard" style="display: none;">
        <div id="user-select-container">
            <select id="user-select">
                <option value="">Selecione um usuário</option>
            </select>
        </div>
        <button id="view-confirmed-indications">Indicações Confirmadas</button>
        <div id="user-details" style="display: none;">
            <div id="indications-list"></div>
            <button id="back-to-users">Voltar</button>
        </div>
        <button id="logout">Sair</button>
    </div>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js"></script>
</body>
</html>
