
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="indicado.css">
        <script type="module" src="script2.js"></script>
        <script type="module" src="block.js"></script>

        <link rel="icon" href="https://firebasestorage.googleapis.com/v0/b/formulario-d2bcb.appspot.com/o/icon.ico?alt=media&token=0d8a61ca-d40d-4b6d-be8a-9cedcac498a7" type="image/x-icon">
        
        <title>Ophicina do Sol</title>
    </head>
    <body>
        <div id="titulo-imagem">
            <img src="logo.webp" />
        </div>
        <form id="indicated-form">
            <div>
                <label for="indicated-first-name">Nome do Cliente:</label>
                <input type="text" id="indicated-first-name">
            </div>
            <div>
                <label for="indicated-email">Email:</label>
                <input type="email" id="indicated-email">
            </div>
            <div>
                <label for="indicated-phone">Telefone:</label>
                <input type="tel" id="indicated-phone">
            </div>
            <div>
                <label for="indicated-endereco">Endereço:</label>
                <input type="text" id="indicated-endereco">
            </div>
            <div>
                <label for="service-type">Tipo de Serviço 1:</label>
                <input type="text" id="service-type">
            </div>
            <div>
                <label for="service2-type">Tipo de Serviço 2:</label>
                <input type="text" id="service2-type">
            </div>
            <div>
                <label for="referrer-name">Nome do Indicador:</label>
                <input type="text" id="referrer-name" readonly>
            </div>
            <button type="button" id="submit-indicated">Confirmar Indicação</button>
            
        </form>
        
        <div class="document-footer">
            <br><br><p1>Desenvolvido por <strong>@renatol123 &copy; 2024</strong></p1>
            </div>
    </body>
    </html>
